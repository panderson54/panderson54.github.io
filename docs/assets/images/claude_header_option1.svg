<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 800" width="2000" height="800">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="2000" height="800" fill="url(#bg1)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="2000" y2="100"/>
    <line x1="0" y1="200" x2="2000" y2="200"/>
    <line x1="0" y1="300" x2="2000" y2="300"/>
    <line x1="0" y1="400" x2="2000" y2="400"/>
    <line x1="0" y1="500" x2="2000" y2="500"/>
    <line x1="0" y1="600" x2="2000" y2="600"/>
    <line x1="0" y1="700" x2="2000" y2="700"/>
    <line x1="250" y1="0" x2="250" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="750" y1="0" x2="750" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="1250" y1="0" x2="1250" y2="800"/>
    <line x1="1500" y1="0" x2="1500" y2="800"/>
    <line x1="1750" y1="0" x2="1750" y2="800"/>
  </g>

  <!-- Glowing orb left -->
  <circle cx="300" cy="400" r="280" fill="#7c3aed" fill-opacity="0.12" filter="url(#softglow)"/>

  <!-- Glowing orb right -->
  <circle cx="1700" cy="350" r="220" fill="#2563eb" fill-opacity="0.12" filter="url(#softglow)"/>

  <!-- Finance chart line (stylized) -->
  <polyline points="120,580 280,520 420,540 560,460 700,430 820,380 920,350 1020,300 1120,260 1260,220 1400,200 1520,170 1640,140 1760,120 1880,100"
    fill="none" stroke="url(#accent1)" stroke-width="3" stroke-opacity="0.6" filter="url(#glow)"/>

  <!-- Chart area fill -->
  <polygon points="120,580 280,520 420,540 560,460 700,430 820,380 920,350 1020,300 1120,260 1260,220 1400,200 1520,170 1640,140 1760,120 1880,100 1880,700 120,700"
    fill="url(#accent1)" fill-opacity="0.06"/>

  <!-- Data points on chart -->
  <circle cx="560" cy="460" r="5" fill="#7c3aed" fill-opacity="0.8" filter="url(#glow)"/>
  <circle cx="820" cy="380" r="5" fill="#7c3aed" fill-opacity="0.8" filter="url(#glow)"/>
  <circle cx="1120" cy="260" r="5" fill="#2563eb" fill-opacity="0.8" filter="url(#glow)"/>
  <circle cx="1400" cy="200" r="5" fill="#2563eb" fill-opacity="0.8" filter="url(#glow)"/>
  <circle cx="1640" cy="140" r="7" fill="#ffffff" fill-opacity="0.9" filter="url(#glow)"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="2000" height="4" fill="url(#accent1)"/>

  <!-- Main title -->
  <text x="200" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="82" font-weight="700" fill="#ffffff" letter-spacing="-2">Building Ledger</text>

  <!-- Subtitle -->
  <text x="203" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="300" fill="#a78bfa" letter-spacing="1">A Personal Finance App Built With Claude</text>

  <!-- Small tag -->
  <rect x="202" y="456" width="220" height="2" fill="url(#accent1)" rx="1"/>

  <!-- Bottom label -->
  <text x="202" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#6b7280" letter-spacing="3">AI-ASSISTED DEVELOPMENT</text>
</svg>
