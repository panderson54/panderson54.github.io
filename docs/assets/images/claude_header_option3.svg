<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 800" width="2000" height="800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="termglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bgglow">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="2000" height="800" fill="url(#bg3)"/>

  <!-- Ambient glows -->
  <circle cx="1000" cy="400" r="500" fill="#7c3aed" fill-opacity="0.04" filter="url(#bgglow)"/>
  <circle cx="200" cy="600" r="300" fill="#2563eb" fill-opacity="0.06" filter="url(#bgglow)"/>
  <circle cx="1800" cy="200" r="250" fill="#10b981" fill-opacity="0.04" filter="url(#bgglow)"/>

  <!-- Terminal window -->
  <rect x="100" y="80" width="840" height="640" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Terminal title bar -->
  <rect x="100" y="80" width="840" height="44" rx="12" fill="#21262d"/>
  <rect x="100" y="104" width="840" height="20" fill="#21262d"/>
  <!-- Traffic lights -->
  <circle cx="136" cy="102" r="7" fill="#ff5f57"/>
  <circle cx="160" cy="102" r="7" fill="#ffbd2e"/>
  <circle cx="184" cy="102" r="7" fill="#28c840"/>

  <!-- Claude chat box -->
  <rect x="130" y="430" width="780" height="34" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Blinking cursor -->
  <rect x="130" y="590" width="10" height="20" rx="1" fill="#10b981" fill-opacity="0.8"/>

  <!-- Accent line -->
  <rect x="1018" y="400" width="600" height="4" rx="2" fill="url(#terminalGrad)"/>

  <!-- Stats row -->
  <rect x="1020" y="560" width="180" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="1220" y="560" width="180" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="1420" y="560" width="180" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
</svg>
